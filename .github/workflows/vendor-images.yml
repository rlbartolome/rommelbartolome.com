name: Vendor images
# Downloads the original site images (listed in images.json) into the repo
# so the site is fully self-contained, then commits them.
# Runs automatically on first push; can also be run manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download images
        run: python scripts/vendor_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/img
          git diff --cached --quiet || git commit -m "Vendor site images into repo"
          git push
